<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفضيلات رحلتك — دلني</title>
  <meta name="description"
    content="حدّد المدينة والميزانية وعدد الأشخاص ونوع الرحلة والفئة العمرية لتحصل على توصيات سياحية فلسطينية مناسبة." />
  <meta property="og:title" content="تفضيلات رحلتك — دلني" />
  <meta property="og:description" content="أخبرنا بتفضيلاتك لنرشّح لك أنسب المواقع في فلسطين." />
  <meta name="theme-color" content="#3d4a30" />

  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            foreground: "var(--foreground)",
            card: "var(--card)",
            "card-foreground": "var(--card-foreground)",
            primary: "var(--primary)",
            "primary-foreground": "var(--primary-foreground)",
            secondary: "var(--secondary)",
            "secondary-foreground": "var(--secondary-foreground)",
            muted: "var(--muted)",
            "muted-foreground": "var(--muted-foreground)",
            accent: "var(--accent)",
            "accent-foreground": "var(--accent-foreground)",
            destructive: "var(--destructive)",
            "destructive-foreground": "var(--destructive-foreground)",
            border: "var(--border)",
            input: "var(--input)",
            ring: "var(--ring)",
            olive: "var(--olive)",
            "olive-foreground": "var(--olive-foreground)",
            sand: "var(--sand)",
            terracotta: "var(--terracotta)",
            "terracotta-foreground": "var(--terracotta-foreground)",
            copper: "var(--copper)",
            hero: "var(--hero)",
            "hero-foreground": "var(--hero-foreground)",
          },
          fontFamily: {
            sans: ["Noto Kufi Arabic", "IBM Plex Sans Arabic", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Cairo", "sans-serif"],
          },
          borderRadius: {
            sm: "calc(var(--radius) - 4px)",
            md: "calc(var(--radius) - 2px)",
            lg: "var(--radius)",
            xl: "calc(var(--radius) + 4px)",
            "2xl": "calc(var(--radius) + 8px)",
            "3xl": "calc(var(--radius) + 12px)",
            "4xl": "calc(var(--radius) + 16px)",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(0.955 0.019 88);
      --foreground: oklch(0.38 0.052 119);
      --card: oklch(0.985 0.008 88);
      --card-foreground: oklch(0.38 0.052 119);
      --olive: oklch(0.38 0.052 119);
      --olive-foreground: oklch(0.97 0.015 88);
      --sand: oklch(0.84 0.045 82);
      --terracotta: oklch(0.49 0.11 38);
      --terracotta-foreground: oklch(0.97 0.015 88);
      --primary: oklch(0.38 0.052 119);
      --primary-foreground: oklch(0.97 0.015 88);
      --secondary: oklch(0.84 0.045 82);
      --secondary-foreground: oklch(0.32 0.045 119);
      --muted: oklch(0.91 0.025 87);
      --muted-foreground: oklch(0.48 0.025 92);
      --accent: oklch(0.49 0.11 38);
      --accent-foreground: oklch(0.97 0.015 88);
      --destructive: oklch(0.577 0.245 27.325);
      --destructive-foreground: oklch(0.98 0.01 95);
      --border: oklch(0.8 0.038 84);
      --input: oklch(0.8 0.038 84);
      --ring: oklch(0.49 0.11 38);
      --copper: oklch(0.64 0.105 67);
      --hero: oklch(0.22 0.03 105);
      --hero-foreground: oklch(0.97 0.015 88);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: "Cairo", sans-serif;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-background text-foreground">

  <div class="mx-auto min-h-screen max-w-xl px-6 py-10">
    <a href="index.html"
      class="inline-flex items-center gap-1.5 text-sm font-medium text-muted-foreground hover:text-foreground">
      <i data-lucide="arrow-right" class="size-4"></i>
      العودة للرئيسية
    </a>

    <h1 class="mt-6 text-3xl font-bold">أخبرنا عن رحلتك</h1>
    <p class="mt-2 text-muted-foreground">خمسة أسئلة بسيطة، ونرشّح لك أنسب الأماكن في فلسطين.</p>

    <form id="prefs-form" class="mt-8 space-y-5">

      <!-- City -->
      <fieldset class="rounded-2xl border bg-card p-5">
        <legend class="flex items-center gap-2 px-1 text-sm font-bold">
          <i data-lucide="map-pin" class="size-4 text-terracotta"></i>
          المدينة
        </legend>
        <div class="mt-2">
          <select id="field-city" aria-label="المدينة"
            class="w-full rounded-xl border border-input bg-card px-4 py-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
            <option value="Jerusalem">القدس</option>
            <option value="Bethlehem">بيت لحم</option>
            <option value="Hebron">الخليل</option>
            <option value="Jenin">جنين</option>
            <option value="Jericho">أريحا</option>
            <option value="Nablus">نابلس</option>
            <option value="Qalqilya">قلقيلية</option>
            <option value="Ramallah">رام الله</option>
            <option value="Tubas">طوباس</option>
            <option value="Tulkarm">طولكرم</option>
          </select>
        </div>
      </fieldset>

      <!-- Budget -->
      <fieldset class="rounded-2xl border bg-card p-5">
        <legend class="flex items-center gap-2 px-1 text-sm font-bold">
          <i data-lucide="wallet" class="size-4 text-terracotta"></i>
          مستوى الميزانية
        </legend>
        <div class="mt-2 flex flex-wrap gap-2" id="group-budget" data-selected="Medium">
          <button type="button" data-value="Low"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">منخفضة</button>
          <button type="button" data-value="Medium"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-primary bg-primary text-primary-foreground">متوسطة</button>
          <button type="button" data-value="High"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">مرتفعة</button>
        </div>
      </fieldset>

      <!-- Group size -->
      <fieldset class="rounded-2xl border bg-card p-5">
        <legend class="flex items-center gap-2 px-1 text-sm font-bold">
          <i data-lucide="users" class="size-4 text-terracotta"></i>
          عدد الأشخاص
        </legend>
        <div class="mt-2">
          <input id="field-people" type="number" min="1" max="50" value="2" aria-label="عدد الأشخاص"
            class="w-full rounded-xl border border-input bg-card px-4 py-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
        </div>
      </fieldset>

      <!-- Trip type (single-select, to match the backend's single TripType field) -->
      <fieldset class="rounded-2xl border bg-card p-5">
        <legend class="flex items-center gap-2 px-1 text-sm font-bold">
          <i data-lucide="compass" class="size-4 text-terracotta"></i>
          نوع الرحلة
        </legend>
        <div class="mt-2 flex flex-wrap gap-2" id="group-triptype" data-selected="">
          <button type="button" data-value="Adventure"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">مغامرة</button>
          <button type="button" data-value="Cultural"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">ثقافية</button>
          <button type="button" data-value="Educational"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">تعليمية</button>
          <button type="button" data-value="Family"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">عائلية</button>
          <button type="button" data-value="Relaxing"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">استجمام</button>
          <button type="button" data-value="Religious"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">دينية</button>
        </div>
        <p id="triptype-error" class="mt-2 hidden text-sm font-medium text-destructive">اختر نوع رحلة واحداً على الأقل
        </p>
      </fieldset>

      <!-- Age group -->
      <fieldset class="rounded-2xl border bg-card p-5">
        <legend class="flex items-center gap-2 px-1 text-sm font-bold">
          <i data-lucide="star" class="size-4 text-terracotta"></i>
          الفئة العمرية
        </legend>
        <div class="mt-2 flex flex-wrap gap-2" id="group-agegroup" data-selected="Family">
          <button type="button" data-value="All"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">الجميع</button>
          <button type="button" data-value="Family"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-primary bg-primary text-primary-foreground">عائلي</button>
          <button type="button" data-value="Youth"
            class="chip rounded-full border px-4 py-2 text-sm font-medium transition-colors border-border bg-card hover:border-primary/40">شبابي</button>
        </div>
      </fieldset>

      <p id="submit-error"
        class="hidden rounded-xl border border-destructive/30 bg-destructive/5 p-3 text-sm font-medium text-destructive">
      </p>

      <button id="submit-btn" type="submit"
        class="w-full rounded-xl bg-primary px-6 py-4 text-base font-bold text-primary-foreground transition-colors hover:bg-primary/90 disabled:opacity-60">
        أعطني التوصيات
      </button>
    </form>
  </div>

  <script>
    lucide.createIcons();

    // Local dev API base — http avoids the self-signed HTTPS dev-cert warning.
    // Switch to "https://localhost:7080" once the dev cert is trusted (dotnet dev-certs trust).
    const API_BASE = "http://localhost:5286";

    // Wire up single-select chip groups.
    function setupChipGroup(groupId) {
      const group = document.getElementById(groupId);
      const chips = group.querySelectorAll(".chip");
      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          chips.forEach((c) => {
            c.classList.remove("border-primary", "bg-primary", "text-primary-foreground");
            c.classList.add("border-border", "bg-card", "hover:border-primary/40");
          });
          chip.classList.remove("border-border", "bg-card", "hover:border-primary/40");
          chip.classList.add("border-primary", "bg-primary", "text-primary-foreground");
          group.dataset.selected = chip.dataset.value;
        });
      });
    }
    ["group-budget", "group-triptype", "group-agegroup"].forEach(setupChipGroup);

    const form = document.getElementById("prefs-form");
    const submitBtn = document.getElementById("submit-btn");
    const tripTypeError = document.getElementById("triptype-error");
    const submitError = document.getElementById("submit-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitError.classList.add("hidden");
      tripTypeError.classList.add("hidden");

      const tripType = document.getElementById("group-triptype").dataset.selected;
      if (!tripType) {
        tripTypeError.classList.remove("hidden");
        return;
      }

      const payload = {
        City: document.getElementById("field-city").value,
        TripType: tripType,
        AgeGroup: document.getElementById("group-agegroup").dataset.selected,
        GroupSize: Math.max(1, Number(document.getElementById("field-people").value) || 1),
        BudgetLevel: document.getElementById("group-budget").dataset.selected,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "جارٍ التحميل...";

      try {
        const res = await fetch(`${API_BASE}/api/Recommendations`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const errBody = await res.json().catch(() => null);
          const msg = errBody?.message || "تعذر جلب التوصيات، حاول مرة أخرى.";
          submitError.textContent = msg;
          submitError.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "أعطني التوصيات";
          return;
        }

        const data = await res.json();
        sessionStorage.setItem("aiTravelResults", JSON.stringify(data));
        sessionStorage.setItem("aiTravelPrefs", JSON.stringify(payload));
        window.location.href = "results.html";
      } catch (err) {
        submitError.textContent = "تعذر الاتصال بالخادم. تأكد أن الـ API شغّال وأن CORS مفعّل.";
        submitError.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "أعطني التوصيات";
      }
    });
  </script>
</body>

</html>
