<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التوصيات المناسبة لك — دلني</title>
  <meta name="description" content="قائمة مرتبة بأنسب المواقع السياحية والتراثية والطبيعية في فلسطين حسب تفضيلاتك." />
  <meta property="og:title" content="التوصيات المناسبة لك — دلني" />
  <meta property="og:description" content="أنسب الأماكن في فلسطين حسب تفضيلاتك، مرتبة حسب الملاءمة." />
  <meta name="theme-color" content="#3d4a30" />

  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            foreground: "var(--foreground)",
            card: "var(--card)",
            "card-foreground": "var(--card-foreground)",
            primary: "var(--primary)",
            "primary-foreground": "var(--primary-foreground)",
            secondary: "var(--secondary)",
            "secondary-foreground": "var(--secondary-foreground)",
            muted: "var(--muted)",
            "muted-foreground": "var(--muted-foreground)",
            accent: "var(--accent)",
            "accent-foreground": "var(--accent-foreground)",
            destructive: "var(--destructive)",
            "destructive-foreground": "var(--destructive-foreground)",
            border: "var(--border)",
            input: "var(--input)",
            ring: "var(--ring)",
            olive: "var(--olive)",
            "olive-foreground": "var(--olive-foreground)",
            sand: "var(--sand)",
            terracotta: "var(--terracotta)",
            "terracotta-foreground": "var(--terracotta-foreground)",
            copper: "var(--copper)",
            hero: "var(--hero)",
            "hero-foreground": "var(--hero-foreground)",
          },
          fontFamily: {
            sans: ["Noto Kufi Arabic", "IBM Plex Sans Arabic", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Cairo", "sans-serif"],
          },
          borderRadius: {
            sm: "calc(var(--radius) - 4px)",
            md: "calc(var(--radius) - 2px)",
            lg: "var(--radius)",
            xl: "calc(var(--radius) + 4px)",
            "2xl": "calc(var(--radius) + 8px)",
            "3xl": "calc(var(--radius) + 12px)",
            "4xl": "calc(var(--radius) + 16px)",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(0.955 0.019 88);
      --foreground: oklch(0.38 0.052 119);
      --card: oklch(0.985 0.008 88);
      --card-foreground: oklch(0.38 0.052 119);
      --olive: oklch(0.38 0.052 119);
      --olive-foreground: oklch(0.97 0.015 88);
      --sand: oklch(0.84 0.045 82);
      --terracotta: oklch(0.49 0.11 38);
      --terracotta-foreground: oklch(0.97 0.015 88);
      --primary: oklch(0.38 0.052 119);
      --primary-foreground: oklch(0.97 0.015 88);
      --secondary: oklch(0.84 0.045 82);
      --secondary-foreground: oklch(0.32 0.045 119);
      --muted: oklch(0.91 0.025 87);
      --muted-foreground: oklch(0.48 0.025 92);
      --accent: oklch(0.49 0.11 38);
      --accent-foreground: oklch(0.97 0.015 88);
      --destructive: oklch(0.577 0.245 27.325);
      --destructive-foreground: oklch(0.98 0.01 95);
      --border: oklch(0.8 0.038 84);
      --input: oklch(0.8 0.038 84);
      --ring: oklch(0.49 0.11 38);
      --copper: oklch(0.64 0.105 67);
      --hero: oklch(0.22 0.03 105);
      --hero-foreground: oklch(0.97 0.015 88);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: "Cairo", sans-serif;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-background text-foreground">

  <div class="mx-auto min-h-screen max-w-3xl px-6 py-10">
    <a href="preferences.html"
      class="inline-flex items-center gap-1.5 text-sm font-medium text-muted-foreground hover:text-foreground">
      <i data-lucide="arrow-right" class="size-4"></i>
      تعديل التفضيلات
    </a>
    <h1 class="mt-6 text-3xl font-bold">أنسب الأماكن لك</h1>
    <p id="subtitle" class="mt-2 text-muted-foreground"></p>
    <div id="results-container" class="mt-8"></div>
  </div>

  <script>
    lucide.createIcons();

    const CITY_LABELS = {
      Bethlehem: "بيت لحم", Hebron: "الخليل", Jenin: "جنين", Jericho: "أريحا",
      Jerusalem: "القدس", Nablus: "نابلس", Qalqilya: "قلقيلية",
      Ramallah: "رام الله", Tubas: "طوباس", Tulkarm: "طولكرم",
    };

    // Based on the real Place.PlaceType values from the backend entity
    // (Religious / Historic / Archaeological ...). Add more keys here as
    // the actual dataset reveals additional values; unknown values still
    // render fine via the fallback style below.
    const PLACE_TYPE_LABELS = {
      Religious: "ديني", Historic: "تاريخي", Archaeological: "أثري",
      Natural: "طبيعي", Cultural: "ثقافي", Touristic: "سياحي",
    };
    const PLACE_TYPE_STYLES = {
      Religious: "bg-terracotta/10 text-terracotta",
      Historic: "bg-sand text-foreground",
      Archaeological: "bg-olive/10 text-olive",
      Natural: "bg-olive/10 text-olive",
      Cultural: "bg-secondary text-secondary-foreground",
      Touristic: "bg-secondary text-secondary-foreground",
    };
    const FALLBACK_TYPE_STYLE = "bg-secondary text-secondary-foreground";

    const subtitleEl = document.getElementById("subtitle");
    const container = document.getElementById("results-container");

    const raw = sessionStorage.getItem("aiTravelResults");
    const rawPrefs = sessionStorage.getItem("aiTravelPrefs");
    const data = raw ? JSON.parse(raw) : null;
    const prefs = rawPrefs ? JSON.parse(rawPrefs) : null;

    if (!data || !Array.isArray(data.Recommendations) || data.Recommendations.length === 0) {
      subtitleEl.textContent = "لا توجد نتائج بعد.";
      container.innerHTML = `
        <p class="rounded-2xl border bg-card p-8 text-center text-muted-foreground">
          لم نجد نتائج محفوظة. جرّب تعديل تفضيلاتك من جديد.
        </p>`;
    } else {
      const places = data.Recommendations;
      const cityLabel = prefs?.City ? CITY_LABELS[prefs.City] || prefs.City : "";
      subtitleEl.textContent = `${places.length} مواقع مرتبة من الأعلى إلى الأقل ملاءمة${cityLabel ? " — " + cityLabel + " والمناطق القريبة منها" : ""}`;

      const grid = document.createElement("ol");
      grid.className = "grid gap-4 sm:grid-cols-2";

      places.forEach((place, i) => {
        const scorePct = Math.round((place.MatchScore || 0) * 100);
        const cityDisplay = CITY_LABELS[place.City] || place.City;

        const li = document.createElement("li");
        li.className = "relative";
        li.innerHTML = `
          <span class="absolute -top-2 start-4 z-10 rounded-full bg-primary px-2.5 py-0.5 text-xs font-bold text-primary-foreground">
            #${i + 1}
          </span>
          <a href="place.html?id=${place.PlaceId}" class="block rounded-2xl border bg-card p-5 transition-colors hover:border-primary/40">
            <div class="flex items-start justify-between gap-3">
              <h3 class="text-lg font-bold leading-snug">${place.PlaceName}</h3>
              <span class="shrink-0 rounded-full px-3 py-1 text-xs font-semibold ${PLACE_TYPE_STYLES[place.PlaceType] || FALLBACK_TYPE_STYLE}">
                ${PLACE_TYPE_LABELS[place.PlaceType] || place.PlaceType || ""}
              </span>
            </div>
            <p class="mt-1 flex items-center gap-1.5 text-sm text-muted-foreground">
              <i data-lucide="map-pin" class="size-4"></i>
              ${cityDisplay}
            </p>
            <p class="mt-3 text-sm leading-relaxed text-muted-foreground">
              ${place.Description || ""}
            </p>
            <div class="mt-4">
              <div class="flex items-center justify-between text-xs font-medium text-muted-foreground">
                <span>مؤشر الملاءمة</span>
                <span class="font-bold text-primary">${scorePct}٪</span>
              </div>
              <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-muted" role="progressbar" aria-valuenow="${scorePct}" aria-valuemin="0" aria-valuemax="100" aria-label="مؤشر الملاءمة ${scorePct}٪">
                <div class="h-full rounded-full bg-terracotta transition-all" style="width:${scorePct}%"></div>
              </div>
            </div>
          </a>`;
        grid.appendChild(li);
      });

      container.appendChild(grid);
      lucide.createIcons();
    }
  </script>
</body>

</html>
