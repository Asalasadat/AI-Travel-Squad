<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التوصيات المناسبة لك — دلني</title>
  <meta name="description" content="قائمة مرتبة بأنسب المواقع السياحية والتراثية والطبيعية في فلسطين حسب تفضيلاتك." />
  <meta property="og:title" content="التوصيات المناسبة لك — دلني" />
  <meta property="og:description" content="أنسب الأماكن في فلسطين حسب تفضيلاتك، مرتبة حسب الملاءمة." />
  <meta name="theme-color" content="#3d4a30" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)", foreground: "var(--foreground)", card: "var(--card)",
            primary: "var(--primary)", "primary-foreground": "var(--primary-foreground)",
            secondary: "var(--secondary)", "secondary-foreground": "var(--secondary-foreground)",
            muted: "var(--muted)", "muted-foreground": "var(--muted-foreground)",
            destructive: "var(--destructive)", border: "var(--border)", input: "var(--input)", ring: "var(--ring)",
            olive: "var(--olive)", sand: "var(--sand)", terracotta: "var(--terracotta)",
            "terracotta-foreground": "var(--terracotta-foreground)", copper: "var(--copper)",
            hero: "var(--hero)", "hero-foreground": "var(--hero-foreground)",
          },
          fontFamily: { sans: ["Noto Kufi Arabic", "IBM Plex Sans Arabic", "system-ui", "sans-serif"], display: ["Cairo", "sans-serif"] },
          borderRadius: { sm: "calc(var(--radius) - 4px)", md: "calc(var(--radius) - 2px)", lg: "var(--radius)", xl: "calc(var(--radius) + 4px)", "2xl": "calc(var(--radius) + 8px)", "3xl": "calc(var(--radius) + 12px)" },
        }
      }
    };
  </script>
  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(0.955 0.019 88);
      --foreground: oklch(0.38 0.052 119);
      --card: oklch(0.985 0.008 88);
      --olive: oklch(0.38 0.052 119);
      --sand: oklch(0.84 0.045 82);
      --terracotta: oklch(0.49 0.11 38);
      --terracotta-foreground: oklch(0.97 0.015 88);
      --primary: oklch(0.38 0.052 119);
      --primary-foreground: oklch(0.97 0.015 88);
      --secondary: oklch(0.84 0.045 82);
      --secondary-foreground: oklch(0.32 0.045 119);
      --muted: oklch(0.91 0.025 87);
      --muted-foreground: oklch(0.48 0.025 92);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.8 0.038 84);
      --input: oklch(0.8 0.038 84);
      --ring: oklch(0.49 0.11 38);
      --copper: oklch(0.64 0.105 67);
      --hero: oklch(0.22 0.03 105);
      --hero-foreground: oklch(0.97 0.015 88);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: "Cairo", sans-serif;
    }

    .fav-btn[aria-pressed="true"] {
      color: var(--terracotta);
      border-color: var(--terracotta);
    }

    .fav-btn[aria-pressed="true"] svg {
      fill: currentColor;
    }

    .cmp-btn[aria-pressed="true"] {
      color: var(--primary-foreground);
      background: var(--primary);
      border-color: var(--primary);
    }

    .chip[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }

    .tab[aria-selected="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    #map {
      z-index: 0;
    }

    .leaflet-container {
      font-family: inherit;
    }

    .leaflet-popup-content {
      direction: rtl;
      text-align: right;
    }

    .pin {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #fff;
      font: 700 13px Cairo, sans-serif;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px #0005;
    }

    .pin-city {
      width: 34px;
      height: 34px;
      background: var(--card);
      color: var(--terracotta);
      border: 2px dashed var(--terracotta);
    }

    .card-on article {
      outline: 2px solid var(--terracotta);
      outline-offset: 2px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .reveal {
      animation: rise .5s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: var(--d, 0ms);
    }

    .no-scrollbar {
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-nav="solid" class="bg-background text-foreground">

  <main id="main" class="mx-auto max-w-7xl px-5 pb-32 pt-8 sm:px-8">

    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold sm:text-4xl">أنسب الأماكن لك</h1>
        <p id="subtitle" class="mt-2 text-sm text-muted-foreground"></p>
      </div>
      <div class="flex items-center gap-2">
        <a href="preferences.html"
          class="inline-flex items-center gap-1.5 rounded-full border border-border bg-card px-4 py-2 text-sm font-semibold transition-colors hover:border-primary/40"><i
            data-lucide="sliders-horizontal" class="size-4"></i>تعديل التفضيلات</a>
        <button id="share-btn" type="button"
          class="hidden items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"><i
            data-lucide="share-2" class="size-4"></i>مشاركة</button>
      </div>
    </div>
    <div id="pref-chips" class="mt-5 flex flex-wrap gap-2"></div>
    <div id="stats" class="mt-4"></div>

    <div class="mt-7 inline-flex rounded-full border border-border bg-card p-1" role="tablist">
      <button id="tab-results" type="button" role="tab" aria-selected="true"
        class="tab rounded-full px-5 py-2 text-sm font-semibold transition-colors">التوصيات</button>
      <button id="tab-saved" type="button" role="tab" aria-selected="false"
        class="tab rounded-full px-5 py-2 text-sm font-semibold transition-colors">المحفوظة
        <span id="saved-count" class="ms-1 rounded-full bg-muted px-2 py-0.5 text-xs text-foreground">0</span></button>
    </div>

    <div id="view-results" class="mt-6">
      <div id="toolbar" class="mb-6 hidden flex-wrap items-center justify-between gap-3">
        <div id="type-filters" class="flex flex-wrap gap-2"></div>
        <div class="flex flex-wrap items-center gap-2">
          <div id="toggle-filters" class="flex flex-wrap gap-2"></div>
          <label class="flex items-center gap-2 text-sm text-muted-foreground">ترتيب
            <select id="sort"
              class="rounded-full border border-border bg-card px-3 py-1.5 text-xs font-semibold text-foreground">
              <option value="match">الأعلى ملاءمة</option>
              <option value="cost">الأقل تكلفة</option>
            </select>
          </label>
        </div>
      </div>

      <div id="results-container"></div>

      <section id="map-wrap" class="mt-12 hidden">
        <h2 class="text-xl font-bold">على الخريطة</h2>
        <p id="map-note" class="mt-1 text-xs leading-6 text-muted-foreground"></p>
        <div id="map" class="mt-3 h-[420px] w-full overflow-hidden rounded-2xl border"></div>
      </section>
    </div>

    <div id="view-saved" class="mt-6 hidden"></div>
  </main>

  <div id="compare-bar" class="pointer-events-none fixed inset-x-0 bottom-5 z-40 hidden justify-center px-4">
    <div
      class="pointer-events-auto flex w-full max-w-xl items-center gap-3 rounded-2xl border bg-card px-4 py-3 shadow-xl">
      <i data-lucide="columns-2" class="size-5 shrink-0 text-terracotta"></i>
      <p id="compare-text" class="min-w-0 flex-1 truncate text-sm font-medium"></p>
      <button id="compare-clear" type="button"
        class="rounded-full px-3 py-2 text-xs font-semibold text-muted-foreground hover:text-foreground">مسح</button>
      <button id="compare-go" type="button"
        class="rounded-xl bg-primary px-5 py-2 text-sm font-bold text-primary-foreground hover:bg-primary/90 disabled:opacity-50">قارن</button>
    </div>
  </div>

  <div id="modal-share" class="fixed inset-0 z-50 hidden items-center justify-center bg-hero/60 p-4" role="dialog"
    aria-modal="true" aria-labelledby="share-title">
    <div class="w-full max-w-md rounded-2xl border bg-card p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="share-title" class="text-xl font-bold">شارك رحلتك</h2>
        <button type="button" data-close="modal-share" aria-label="إغلاق"
          class="grid size-8 place-items-center rounded-full hover:bg-muted"><i data-lucide="x"
            class="size-4"></i></button>
      </div>
      <p class="mt-2 text-sm text-muted-foreground">أي شخص يفتح الرابط سيحصل على توصيات بنفس تفضيلاتك.</p>
      <div class="mt-4 flex gap-2">
        <input id="share-link" type="text" readonly dir="ltr"
          class="min-w-0 flex-1 rounded-xl border border-input bg-card px-3 py-2.5 text-xs" />
        <button id="share-copy" type="button"
          class="shrink-0 rounded-xl bg-primary px-4 py-2.5 text-sm font-bold text-primary-foreground">نسخ</button>
      </div>
      <div class="mt-5 flex justify-center">
        <div id="share-qr" class="rounded-xl bg-white p-3"></div>
      </div>
      <button id="share-native" type="button"
        class="mt-5 hidden w-full rounded-xl border border-border px-4 py-2.5 text-sm font-semibold hover:border-primary/40">مشاركة
        عبر التطبيقات</button>
      <p id="share-warning" class="mt-4 hidden text-xs text-destructive">هذا الرابط يعمل على جهازك فقط (localhost)، ولن
        يفتح عند الآخرين قبل نشر الموقع.</p>
    </div>
  </div>

  <div id="modal-compare" class="fixed inset-0 z-50 hidden items-center justify-center bg-hero/60 p-4" role="dialog"
    aria-modal="true" aria-labelledby="compare-title">
    <div class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl border bg-card p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="compare-title" class="text-xl font-bold">مقارنة بين مكانين</h2>
        <button type="button" data-close="modal-compare" aria-label="إغلاق"
          class="grid size-8 place-items-center rounded-full hover:bg-muted"><i data-lucide="x"
            class="size-4"></i></button>
      </div>
      <div id="compare-body" class="mt-4 overflow-x-auto"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed inset-x-0 bottom-24 z-[60] hidden justify-center px-6">
    <span id="toast-text" class="rounded-full bg-hero px-4 py-2 text-sm font-medium text-hero-foreground"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    const API_BASE = "http://localhost:5286";
    const LS_FAV = "dalni:favorites";
    const CITY_FALLBACK = { Bethlehem: [31.702327, 35.187644], Hebron: [31.533628, 35.097976], Jenin: [32.468789, 35.296756], Jericho: [31.859361, 35.459795], Jerusalem: [31.695506, 35.187508], Nablus: [32.228066, 35.237042], Qalqilya: [32.190557, 34.966009], Ramallah: [31.898619, 35.178064], Tubas: [32.323439, 35.369366], Tulkarm: [32.313376, 35.022438] };

    const CITY_LABELS = { Bethlehem: "بيت لحم", Hebron: "الخليل", Jenin: "جنين", Jericho: "أريحا", Jerusalem: "القدس", Nablus: "نابلس", Qalqilya: "قلقيلية", Ramallah: "رام الله", Tubas: "طوباس", Tulkarm: "طولكرم" };
    const CITY_BY_AR = { "بيت لحم": "Bethlehem", "الخليل": "Hebron", "جنين": "Jenin", "أريحا": "Jericho", "القدس": "Jerusalem", "نابلس": "Nablus", "قلقيلية": "Qalqilya", "رام الله": "Ramallah", "طوباس": "Tubas", "طولكرم": "Tulkarm" };
    const CITY_XY = { Bethlehem: [31.7054, 35.2024], Hebron: [31.5326, 35.0998], Jenin: [32.461, 35.3], Jericho: [31.8667, 35.4444], Jerusalem: [31.7683, 35.2137], Nablus: [32.2211, 35.2544], Qalqilya: [32.1897, 34.9706], Ramallah: [31.9038, 35.2034], Tubas: [32.3208, 35.3695], Tulkarm: [32.3104, 35.0286] };
    const TRIP_LABELS = { Adventure: "مغامرة", Cultural: "ثقافية", Educational: "تعليمية", Family: "عائلية", Relaxing: "استجمام", Religious: "دينية" };
    const AGE_LABELS = { All: "الجميع", Family: "عائلي", Youth: "شبابي" };
    const BUDGET_LABELS = { Low: "منخفضة", Medium: "متوسطة", High: "مرتفعة" };
    const PLACE_TYPE_LABELS = { "Religious": "ديني", "Historic Old City": "بلدة قديمة", "Archaeological": "أثري", "Museum": "متحف", "Family/Recreational": "ترفيهي عائلي", "Nature & Trails": "طبيعة ومسارات", "Education": "تعليمي", "Historic": "تاريخي", "Cultural": "ثقافي" };
    const TYPE_ICON = { "Religious": "church", "Historic Old City": "castle", "Historic": "castle", "Archaeological": "landmark", "Museum": "building-2", "Family/Recreational": "ferris-wheel", "Nature & Trails": "trees", "Education": "graduation-cap", "Cultural": "theater" };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pick = (o, ...ks) => { for (const k of ks) if (o && o[k] != null) return o[k]; };
    const safeUrl = (u) => (typeof u === "string" && /^(https?:\/\/|assets\/)/i.test(u)) ? u : null;
    const isAr = (s) => /[\u0600-\u06FF]/.test(s || "");
    const cityLabel = (c) => CITY_LABELS[c] || c;
    const typeLabel = (t) => PLACE_TYPE_LABELS[t] || t || "";
    const km = (a, b) => { const r = Math.PI / 180, x = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
    const okPt = (lat, lng, city, max = 45) => { lat = +lat; lng = +lng; const c = CITY_XY[city]; return isFinite(lat) && isFinite(lng) && (lat || lng) && (!c || km([lat, lng], c) <= max); };
    const CHIP = "chip rounded-full border border-border bg-card px-3 py-1.5 text-xs font-semibold transition-colors hover:border-primary/40";

    let toastTimer;
    function toast(msg) {
      $("toast-text").textContent = msg; $("toast").classList.remove("hidden"); $("toast").classList.add("flex");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").classList.add("hidden"); $("toast").classList.remove("flex"); }, 2200);
    }
    const openModal = (id) => { $(id).classList.remove("hidden"); $(id).classList.add("flex"); lucide.createIcons(); };
    const closeModal = (id) => { $(id).classList.add("hidden"); $(id).classList.remove("flex"); };
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => closeModal(b.dataset.close)));
    ["modal-share", "modal-compare"].forEach((id) => $(id).addEventListener("click", (e) => { if (e.target === $(id)) closeModal(id); }));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") ["modal-share", "modal-compare"].forEach(closeModal); });

    function sanitizePayload(o) {
      if (!o || typeof o !== "object") return null;
      const cities = (Array.isArray(o.Cities) ? o.Cities : (o.City ? [o.City] : [])).filter((c) => c in CITY_LABELS);
      const hidden = window.Dalni?.HIDDEN_TRIP_TYPES || ["Family"];
      const trips = (Array.isArray(o.TripTypes) ? o.TripTypes : (o.TripType ? [o.TripType] : [])).filter((t) => t in TRIP_LABELS && !hidden.includes(t));
      const age = o.AgeGroup in AGE_LABELS ? o.AgeGroup : "All";
      const size = Math.min(50, Math.max(1, parseInt(o.GroupSize, 10) || 1));
      const budget = Number(o.Budget);
      if (!cities.length || !trips.length || !(budget > 0) || budget > 1e7) return null;
      return { Cities: cities, TripTypes: trips, AgeGroup: age, GroupSize: size, Budget: budget };
    }
    const encodePayload = (p) => btoa(JSON.stringify(p)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    function decodePayload(s) {
      try { const b = s.replace(/-/g, "+").replace(/_/g, "/"); return sanitizePayload(JSON.parse(atob(b + "=".repeat((4 - (b.length % 4)) % 4)))); } catch { return null; }
    }

    const isPrecise = (lat, lng, city) => {
      const f = CITY_FALLBACK[city];
      return okPt(lat, lng, city, 15) && !(f && Math.abs(lat - f[0]) < 1e-5 && Math.abs(lng - f[1]) < 1e-5);
    };
    async function loadMeta(item) {
      try {
        const res = await fetch(`${API_BASE}/api/Places/${encodeURIComponent(item.id)}`);
        if (!res.ok) return null;
        const d = await res.json(), lat = pick(d, "latitude", "Latitude"), lng = pick(d, "longitude", "Longitude");
        return {
          nameEn: pick(d, "placeName", "PlaceName"), city: pick(d, "city", "City"),
          nameAr: pick(d, "placeNameAr", "PlaceNameAr"), descAr: pick(d, "descriptionAr", "DescriptionAr"),
          image: safeUrl(pick(d, "imageUrl", "ImageUrl", "image", "Image")),
          costIls: pick(d, "estimatedCostIls", "EstimatedCostIls") ?? null,
          budgetLevel: pick(d, "budgetLevel", "BudgetLevel"), tripType: pick(d, "tripType", "TripType"), ageGroup: pick(d, "ageGroup", "AgeGroup"),
          lat, lng, preciseLocation: lat != null && lng != null && isPrecise(+lat, +lng, item.city),
        };
      } catch { return null; }
    }

    function normalizeResponse(d) {
      const list = pick(d, "recommendations", "Recommendations");
      if (!Array.isArray(list)) return null;
      return list.map((p, i) => {
        const s = Number(pick(p, "matchScore", "MatchScore")) || 0;
        const id = Number(pick(p, "placeId", "PlaceId")) || 0, rawCity = String(pick(p, "city", "City") || "").trim();
        return {
          id, linked: id > 0,
          name: String(pick(p, "placeName", "PlaceName") || "").trim(), type: pick(p, "placeType", "PlaceType") || "",
          city: CITY_BY_AR[rawCity] || rawCity, description: pick(p, "description", "Description") || "",
          pct: Math.round(s <= 1 ? s * 100 : s), rank: pick(p, "rankOrder", "RankOrder") ?? i + 1,
          image: safeUrl(pick(p, "imageUrl", "ImageUrl", "image", "Image", "photoUrl", "PhotoUrl")),
        };
      });
    }
    async function fetchRecommendations(pl) {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 90000);
      try {
        const res = await fetch(`${API_BASE}/api/Recommendations`, {
          method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
          body: JSON.stringify({ Cities: pl.Cities, TripTypes: pl.TripTypes, AgeGroup: pl.AgeGroup, Budget: pl.Budget, GroupSize: pl.GroupSize }),
        });
        const body = await res.json().catch(() => null);
        if (!res.ok) { const e = new Error(body?.message || `HTTP ${res.status}`); e.status = res.status; throw e; }
        return body;
      } finally { clearTimeout(timer); }
    }
    function errText(e) {
      if (e?.status === 404) return "ما لقينا أماكن بتناسب ميزانيتك وتفضيلاتك. جرّب ترفع الميزانية أو تضيف مدينة.";
      if (e?.status === 502) return "خدمة التوصيات مش متاحة حالياً. جرّب بعد شوي.";
      if (e?.status === 400) return "في مشكلة بالبيانات المُدخلة. عدّل تفضيلاتك وجرّب من جديد.";
      if (e?.name === "AbortError") return "خدمة التوصيات تأخرت بالرد. جرّب مرة ثانية.";
      return "تعذر الاتصال بالخادم. تأكد إن الـ API شغال وجرّب مرة ثانية.";
    }

    const nameOf = (i) => i.meta?.nameAr || i.name;
    const imgOf = (i) => safeUrl(i.image) || safeUrl(i.meta?.image) || null;
    const autoDesc = (i) => { const m = i.meta; return `${typeLabel(i.type) || "مكان"} في ${cityLabel(i.city)}` + (m ? `، مناسب لرحلة ${TRIP_LABELS[m.tripType] || ""} (${AGE_LABELS[m.ageGroup] || ""})` : ""); };

    function showTab(name) {

    function compareRows(a, b) {

      return `<table class="w-full min-w-[460px] table-fixed border-collapse"><thead><tr><th class="w-1/4"></th>${head(a)}${head(b)}</tr></thead><tbody>${rows.map((r) => row(...r)).join("")}</tbody></table>`;

    });
    $("compare-clear").addEventListener("click", () => {
      state.compare = []; document.querySelectorAll(".cmp-btn").forEach((b) => b.setAttribute("aria-pressed", "false")); updateCompareBar();
    });

    $("view-results").addEventListener("click", (e) => {
      const t = e.target, favB = t.closest("[data-fav]"), cmpB = t.closest("[data-cmp]"), mapB = t.closest("[data-map]"),
        typeB = t.closest("[data-type]"), togB = t.closest("[data-toggle]"), resetB = t.closest("[data-reset]");
      if (resetB) { state.filter = "all"; state.fitOnly = false; state.freeOnly = false; renderFilters(); renderResults(); }
      else if (typeB) { state.filter = typeB.dataset.type; renderFilters(); renderResults(); }
      else if (togB) { const k = togB.dataset.toggle === "fit" ? "fitOnly" : "freeOnly"; state[k] = !state[k]; renderFilters(); renderResults(); }
      else if (mapB) focusMap(mapB.dataset.map);
      else if (favB) {
        const i = byIdItem(favB.dataset.fav); if (!i) return;
        const on = toggleFav(i); favB.setAttribute("aria-pressed", String(on)); favB.querySelector("span").textContent = on ? "محفوظ" : "حفظ";
        if (on) toast("انحفظ المكان");
      } else if (cmpB) {
        const id = cmpB.dataset.cmp;
        if (state.compare.includes(id)) state.compare = state.compare.filter((x) => x !== id);
        else if (state.compare.length >= 2) return toast("بتقدر تقارن مكانين بس");
        else state.compare.push(id);
        cmpB.setAttribute("aria-pressed", String(state.compare.includes(id))); updateCompareBar();
      }
    });
    $("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderResults(); });

    const shareUrl = () => location.href.split(/[?#]/)[0] + "?s=" + encodePayload(state.payload);
    $("share-btn").addEventListener("click", () => {
      if (!state.payload) return;
      const url = shareUrl(); $("share-link").value = url;
      $("share-warning").classList.toggle("hidden", !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.protocol !== "file:");
      const qr = $("share-qr"); qr.innerHTML = "";
      try { new QRCode(qr, { text: url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M }); } catch { qr.textContent = "تعذر إنشاء رمز QR"; }
      $("share-native").classList.toggle("hidden", !navigator.share); openModal("modal-share");
    });
    $("share-copy").addEventListener("click", async () => {
      const input = $("share-link");
      try { await navigator.clipboard.writeText(input.value); } catch { input.select(); document.execCommand("copy"); }
      toast("تم نسخ الرابط");
    });
    $("share-native").addEventListener("click", () => navigator.share({ title: "توصياتي على دلني", url: $("share-link").value }).catch(() => { }));

    (async function init() {
      lucide.createIcons(); $("saved-count").textContent = favs.length;
      const subtitle = $("subtitle"), params = new URLSearchParams(location.search);
      if (params.get("tab") === "saved") showTab("saved");
      let payload = null, raw = null; const shared = params.get("s");
      if (shared) {
        payload = decodePayload(shared);
        if (!payload) { subtitle.textContent = "الرابط غير صالح."; renderEmpty("هذا الرابط غير صالح أو تالف."); return; }
        subtitle.textContent = "جارٍ تحميل التوصيات... (أول طلب ممكن ياخد لحظات)"; showSkeleton();
        try {
          raw = await fetchRecommendations(payload);
          sessionStorage.setItem("aiTravelResults", JSON.stringify(raw)); sessionStorage.setItem("aiTravelPrefs", JSON.stringify(payload));
        } catch (err) { console.error(err); subtitle.textContent = ""; renderEmpty(errText(err)); return; }
      } else {
        try { raw = JSON.parse(sessionStorage.getItem("aiTravelResults") || "null"); payload = sanitizePayload(JSON.parse(sessionStorage.getItem("aiTravelPrefs") || "null")); } catch { raw = null; }
      }
      const items = raw ? normalizeResponse(raw) : null;
      if (!items || !items.length) { subtitle.textContent = "لا توجد نتائج بعد."; renderEmpty("ما لقينا نتائج محفوظة. جرّب تعدّل تفضيلاتك من جديد."); return; }

      subtitle.textContent = "جارٍ تحميل تفاصيل الأماكن..."; showSkeleton();
      const imgIdx = window.Dalni ? await window.Dalni.imageIndex() : new Map();
      await Promise.all(items.map(async (i) => {
        i.meta = i.linked ? await loadMeta(i) : null;
        if (i.meta?.city) i.city = i.meta.city;
        if (!imgOf(i)) { const n = window.Dalni.normName, e = imgIdx.get(n(i.meta?.nameEn || "")) || imgIdx.get(n(i.name)); if (e) i.image = safeUrl(e.image); }
      }));
      state.items = items; state.payload = payload;
      subtitle.textContent = "مرتبة من الأعلى إلى الأقل ملاءمة لتفضيلاتك";
      if (payload) { $("share-btn").classList.remove("hidden"); $("share-btn").classList.add("inline-flex"); }
      try { sessionStorage.setItem("dalni:items", JSON.stringify(items.map((i) => ({ id: i.id, linked: i.linked, name: nameOf(i), city: i.city, type: i.type, pct: i.pct, rank: i.rank })))); } catch { }
      renderSummary(); renderFilters(); renderResults();
    })();
  </script>
</body>

</html>
