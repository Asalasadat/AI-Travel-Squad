<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الموقع — دلني</title>
  <meta name="theme-color" content="#3d4a30" />

  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)", foreground: "var(--foreground)",
            card: "var(--card)", primary: "var(--primary)", "primary-foreground": "var(--primary-foreground)",
            secondary: "var(--secondary)", "secondary-foreground": "var(--secondary-foreground)",
            muted: "var(--muted)", "muted-foreground": "var(--muted-foreground)",
            destructive: "var(--destructive)", border: "var(--border)", input: "var(--input)", ring: "var(--ring)",
            olive: "var(--olive)", sand: "var(--sand)", terracotta: "var(--terracotta)", "terracotta-foreground": "var(--terracotta-foreground)",
            copper: "var(--copper)", hero: "var(--hero)", "hero-foreground": "var(--hero-foreground)",
          },
          fontFamily: {
            sans: ["Noto Kufi Arabic", "IBM Plex Sans Arabic", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Cairo", "sans-serif"],
          },
          borderRadius: {
            sm: "calc(var(--radius) - 4px)", md: "calc(var(--radius) - 2px)", lg: "var(--radius)",
            xl: "calc(var(--radius) + 4px)", "2xl": "calc(var(--radius) + 8px)", "3xl": "calc(var(--radius) + 12px)",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(0.955 0.019 88);
      --foreground: oklch(0.38 0.052 119);
      --card: oklch(0.985 0.008 88);
      --olive: oklch(0.38 0.052 119);
      --sand: oklch(0.84 0.045 82);
      --terracotta: oklch(0.49 0.11 38);
      --terracotta-foreground: oklch(0.97 0.015 88);
      --primary: oklch(0.38 0.052 119);
      --primary-foreground: oklch(0.97 0.015 88);
      --secondary: oklch(0.84 0.045 82);
      --secondary-foreground: oklch(0.32 0.045 119);
      --muted: oklch(0.91 0.025 87);
      --muted-foreground: oklch(0.48 0.025 92);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.8 0.038 84);
      --input: oklch(0.8 0.038 84);
      --ring: oklch(0.49 0.11 38);
      --copper: oklch(0.64 0.105 67);
      --hero: oklch(0.22 0.03 105);
      --hero-foreground: oklch(0.97 0.015 88);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: "Cairo", sans-serif;
    }

    .fav-btn[aria-pressed="true"] {
      color: var(--terracotta);
    }

    .fav-btn[aria-pressed="true"] svg {
      fill: currentColor;
    }

    #place-map {
      z-index: 0;
    }

    .leaflet-container {
      font-family: inherit;
    }

    .leaflet-popup-content {
      direction: rtl;
      text-align: right;
    }

    .pin {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #fff;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px #0005;
    }

    /* ظهور الهيرو مرة وحدة */
    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade .5s ease both;
    }

    .no-scrollbar {
      scrollbar-width: none;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-nav="solid" class="bg-background text-foreground">

  <main class="mx-auto max-w-6xl px-5 pb-20 pt-6 sm:px-8">
    <nav id="crumbs" aria-label="مسار التنقل" class="flex flex-wrap items-center gap-1.5 text-sm text-muted-foreground">
    </nav>
    <div id="place-root" class="mt-5">
      <div class="aspect-[4/3] animate-pulse rounded-3xl bg-muted sm:aspect-[21/9]"></div>
      <div class="mt-8 space-y-3">
        <div class="h-5 w-1/2 animate-pulse rounded bg-muted"></div>
        <div class="h-5 w-3/4 animate-pulse rounded bg-muted"></div>
      </div>
    </div>
  </main>

  <div id="modal-share" class="fixed inset-0 z-50 hidden items-center justify-center bg-hero/60 p-4" role="dialog"
    aria-modal="true" aria-labelledby="share-title">
    <div class="w-full max-w-md rounded-2xl border bg-card p-6">
      <div class="flex items-start justify-between gap-3">
        <h2 id="share-title" class="text-xl font-bold">شارك هذا المكان</h2>
        <button type="button" id="share-close" aria-label="إغلاق"
          class="grid size-8 place-items-center rounded-full hover:bg-muted"><i data-lucide="x"
            class="size-4"></i></button>
      </div>
      <div class="mt-4 flex gap-2">
        <input id="share-link" type="text" readonly dir="ltr"
          class="min-w-0 flex-1 rounded-xl border border-input bg-card px-3 py-2.5 text-xs" />
        <button id="share-copy" type="button"
          class="shrink-0 rounded-xl bg-primary px-4 py-2.5 text-sm font-bold text-primary-foreground">نسخ</button>
      </div>
      <div class="mt-5 flex justify-center">
        <div id="share-qr" class="rounded-xl bg-white p-3"></div>
      </div>
      <button id="share-native" type="button"
        class="mt-5 hidden w-full rounded-xl border border-border px-4 py-2.5 text-sm font-semibold hover:border-primary/40">مشاركة
        عبر التطبيقات</button>
      <p id="share-warning" class="mt-4 hidden text-xs text-destructive">هذا الرابط يعمل على جهازك فقط (localhost)، ولن
        يفتح عند الآخرين قبل نشر الموقع.</p>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed inset-x-0 bottom-6 z-[60] hidden justify-center px-6">
    <span id="toast-text" class="rounded-full bg-hero px-4 py-2 text-sm font-medium text-hero-foreground"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    // Keep in sync with results.html / preferences.html
    const API_BASE = "http://localhost:5286";
    const LS_FAV = "dalni:favorites";

    const CITY_LABELS = { Bethlehem: "بيت لحم", Hebron: "الخليل", Jenin: "جنين", Jericho: "أريحا", Jerusalem: "القدس", Nablus: "نابلس", Qalqilya: "قلقيلية", Ramallah: "رام الله", Tubas: "طوباس", Tulkarm: "طولكرم" };
    const PLACE_TYPE_LABELS = { Religious: "ديني", Historic: "تاريخي", Historical: "تاريخي", "Historic Old City": "بلدة قديمة", Archaeological: "أثري", Museum: "متحف", "Family/Recreational": "ترفيهي عائلي", "Nature & Trails": "طبيعة ومسارات", Education: "تعليمي", Natural: "طبيعي", Cultural: "ثقافي", Touristic: "سياحي" };
    const TYPE_ICON = { "Religious": "church", "Historic Old City": "castle", "Historic": "castle", "Archaeological": "landmark", "Museum": "building-2", "Family/Recreational": "ferris-wheel", "Nature & Trails": "trees", "Education": "graduation-cap", "Cultural": "theater" };
    const BUDGET_LABELS = { Low: "منخفضة", Medium: "متوسطة", High: "مرتفعة" };
    const TRIP_TYPE_LABELS = { Adventure: "مغامرة", Cultural: "ثقافية", Educational: "تعليمية", Family: "عائلية", Relaxing: "استجمام", Religious: "دينية" };
    const AGE_GROUP_LABELS = { All: "الجميع", Family: "عائلي", Youth: "شبابي" };

    const CITY_XY = { Bethlehem: [31.7054, 35.2024], Hebron: [31.5326, 35.0998], Jenin: [32.461, 35.3], Jericho: [31.8667, 35.4444], Jerusalem: [31.7683, 35.2137], Nablus: [32.2211, 35.2544], Qalqilya: [32.1897, 34.9706], Ramallah: [31.9038, 35.2034], Tubas: [32.3208, 35.3695], Tulkarm: [32.3104, 35.0286] };
    const CITY_FALLBACK = { Bethlehem: [31.702327, 35.187644], Hebron: [31.533628, 35.097976], Jenin: [32.468789, 35.296756], Jericho: [31.859361, 35.459795], Jerusalem: [31.695506, 35.187508], Nablus: [32.228066, 35.237042], Qalqilya: [32.190557, 34.966009], Ramallah: [31.898619, 35.178064], Tubas: [32.323439, 35.369366], Tulkarm: [32.313376, 35.022438] };
    const km = (a, b) => { const r = Math.PI / 180, x = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
    const nearCity = (lat, lng, city) => CITY_XY[city] && isFinite(+lat) && isFinite(+lng) && km([+lat, +lng], CITY_XY[city]) <= 15;
    // الإحداثيات دقيقة فقط لو قريبة من مدينتها وما هي نقطة المدينة الاحتياطية نفسها
    const isPrecise = (lat, lng, city) => { const f = CITY_FALLBACK[city]; return nearCity(lat, lng, city) && !(f && Math.abs(lat - f[0]) < 1e-5 && Math.abs(lng - f[1]) < 1e-5); };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pick = (o, ...ks) => { for (const k of ks) if (o && o[k] != null) return o[k]; };
    const isAr = (s) => /[\u0600-\u06FF]/.test(s || "");
    const safeUrl = (u) => (typeof u === "string" && /^(https?:\/\/|assets\/)/i.test(u)) ? u : null;
    lucide.createIcons();

    let toastTimer;
    function toast(m) {
      $("toast-text").textContent = m; $("toast").classList.remove("hidden"); $("toast").classList.add("flex");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").classList.add("hidden"); $("toast").classList.remove("flex"); }, 2200);
    }

    // ----- Saved places: same localStorage key as results.html -----
    const loadFavs = () => { try { const v = JSON.parse(localStorage.getItem(LS_FAV) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } };
    const isFav = (id) => loadFavs().some((f) => String(f.id) === String(id));
    function toggleFav(p) {
      let l = loadFavs();
      if (isFav(p.id)) l = l.filter((f) => String(f.id) !== String(p.id)); else l.push({ id: p.id, name: p.name, city: p.city, type: p.type });
      try { localStorage.setItem(LS_FAV, JSON.stringify(l)); } catch { toast("تعذر الحفظ على هذا المتصفح"); }
      window.Dalni?.refreshFavBadge();
    }

    // ----- Data from the search session -----
    function loadPrefs() {
      try {
        const o = JSON.parse(sessionStorage.getItem("aiTravelPrefs") || "null"); if (!o) return null;
        const b = Number(o.Budget);
        return { cities: [].concat(o.Cities || o.City || []), trips: [].concat(o.TripTypes || o.TripType || []), age: o.AgeGroup, size: Math.min(50, Math.max(1, parseInt(o.GroupSize, 10) || 1)), budget: b > 0 ? b : null };
      } catch { return null; }
    }
    function loadItems() { try { const v = JSON.parse(sessionStorage.getItem("dalni:items") || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }

    // ----- Small UI pieces -----
    function ring(pct, size = 72) {
      const r = 15.5, c = 2 * Math.PI * r;
      return `<div class="relative shrink-0" style="width:${size}px;height:${size}px" role="img" aria-label="ملاءمة ${pct}٪">
        <svg viewBox="0 0 40 40" class="-rotate-90" width="${size}" height="${size}"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--muted)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--terracotta)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}"/></svg>
        <span class="absolute inset-0 grid place-items-center font-display text-lg font-extrabold">${pct}٪</span></div>`;
    }
    const chips = (arr, labels) => arr.map((t) => `<span class="rounded-full bg-muted px-2.5 py-0.5 text-xs font-semibold">${esc(labels[t] || t)}</span>`).join("");
    const factRow = (icon, label, body) => `<div class="flex items-start justify-between gap-4 px-5 py-4">
      <dt class="flex shrink-0 items-center gap-2 text-sm text-muted-foreground"><i data-lucide="${icon}" class="size-4 text-olive"></i>${label}</dt>
      <dd class="flex flex-wrap justify-end gap-1.5 text-sm font-bold">${body}</dd></div>`;

    function fitHTML(p) {
      const pl = loadPrefs(); if (!pl) return "";
      const rs = [], hit = p.trips.filter((t) => pl.trips.includes(t));
      if (pl.cities.includes(p.city)) rs.push(`مدينتك: ${CITY_LABELS[p.city] || p.city}`);
      if (hit.length) rs.push(`نوع الرحلة: ${hit.map((t) => TRIP_TYPE_LABELS[t] || t).join("، ")}`);
      if (p.ages.includes("All")) rs.push("مناسب لجميع الفئات"); else if (p.ages.includes(pl.age)) rs.push(`الفئة: ${AGE_GROUP_LABELS[pl.age] || pl.age}`);
      if (!rs.length) return "";
      return `<section class="rounded-2xl border border-terracotta/25 bg-terracotta/5 p-5">
        <h2 class="font-display text-sm font-bold text-terracotta">ليش رشّحناه لك؟</h2>
        <div class="mt-3 flex flex-wrap gap-2">${rs.map((t) => `<span class="rounded-full bg-card px-3 py-1 text-xs font-medium">${esc(t)}</span>`).join("")}</div></section>`;
    }

    // ----- Breadcrumb -----
    function renderCrumbs(name) {
      const hasRes = !!sessionStorage.getItem("aiTravelResults");
      const sep = `<i data-lucide="chevron-left" class="size-4 opacity-60"></i>`;
      const a = (h, t) => `<a href="${h}" class="hover:text-foreground">${t}</a>`;
      $("crumbs").innerHTML = [a("index.html", "الرئيسية"), hasRes ? a("results.html", "التوصيات") : a("preferences.html", "خطط رحلتك"),
      `<span class="font-semibold text-foreground" aria-current="page">${esc(name || "…")}</span>`].join(sep);
      lucide.createIcons();
    }

    // ----- Save / share -----
    function wireActions(p) {
      const fb = $("fav-btn");
      const paint = () => { const on = isFav(p.id); fb.setAttribute("aria-pressed", String(on)); fb.querySelector("span").textContent = on ? "محفوظ" : "حفظ"; };
      paint(); fb.onclick = () => { toggleFav(p); paint(); if (isFav(p.id)) toast("انحفظ المكان"); };
      const modal = $("modal-share"), close = () => { modal.classList.add("hidden"); modal.classList.remove("flex"); };
      $("share-btn").onclick = () => {
        const url = location.href.split(/[?#]/)[0] + "?id=" + encodeURIComponent(p.id);
        $("share-link").value = url;
        $("share-warning").classList.toggle("hidden", !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.protocol !== "file:");
        const qr = $("share-qr"); qr.innerHTML = "";
        try { new QRCode(qr, { text: url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M }); } catch { qr.textContent = "تعذر إنشاء رمز QR"; }
        $("share-native").classList.toggle("hidden", !navigator.share);
        modal.classList.remove("hidden"); modal.classList.add("flex"); lucide.createIcons();
      };
      $("share-close").onclick = close; modal.onclick = (e) => { if (e.target === modal) close(); };
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
      $("share-copy").onclick = async () => {
        const i = $("share-link");
        try { await navigator.clipboard.writeText(i.value); } catch { i.select(); document.execCommand("copy"); }
        toast("تم نسخ الرابط");
      };
      $("share-native").onclick = () => navigator.share({ title: `${p.name} — دلني`, url: $("share-link").value }).catch(() => { });
    }

    // ----- Cost calculator (frontend only) -----
    function wireCalc(p) {
      if (p.cost == null || p.cost === 0 || !$("n-val")) return;
      const pl = loadPrefs(); let n = pl?.size || 2;
      const paint = () => {
        const total = p.cost * n;
        $("n-val").textContent = n; $("calc-total").textContent = `${total} ₪`;
        $("calc-note").textContent = `${p.cost} ₪ للشخص × ${n}`;
        if (pl?.budget) {
          const ok = total <= pl.budget, pct = Math.min(100, Math.round(total / pl.budget * 100));
          $("calc-bar").style.width = pct + "%"; $("calc-bar").style.background = ok ? "var(--olive)" : "var(--terracotta)";
          $("calc-fit").className = "mt-2 text-xs font-semibold " + (ok ? "text-olive" : "text-terracotta");
          $("calc-fit").textContent = ok ? `ضمن ميزانيتك (${pl.budget} ₪)` : `أعلى من ميزانيتك بـ ${total - pl.budget} ₪`;
        }
        $("n-dec").disabled = n <= 1; $("n-inc").disabled = n >= 50;
      };
      $("n-dec").onclick = () => { if (n > 1) { n--; paint(); } };
      $("n-inc").onclick = () => { if (n < 50) { n++; paint(); } };
      paint();
    }

    // ----- Mini map -----
    function wireMap(p) {
      const el = $("place-map"); if (!el || typeof L === "undefined") return;
      const c = CITY_XY[p.city], ll = p.precise ? [+p.lat, +p.lng] : c; if (!ll) { el.closest("section").remove(); return; }
      const map = L.map(el, { scrollWheelZoom: false }).setView(ll, p.precise ? 15 : 12);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
      if (p.precise) L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="pin"><span style="width:8px;height:8px;border-radius:50%;background:#fff;display:block"></span></div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map).bindPopup(esc(p.name));
      else L.circle(ll, { radius: 2500, color: "#a6572e", dashArray: "4 4", fillOpacity: 0.12 }).addTo(map);
      setTimeout(() => map.invalidateSize(), 100);
    }

    // ----- Data -----
    // Returns null when the place doesn't exist; throws on a network/server error.
    async function loadPlace(id) {
      const r = await fetch(`${API_BASE}/api/Places/${encodeURIComponent(id)}`);
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const en = pick(d, "placeName", "PlaceName") || "", ar = pick(d, "placeNameAr", "PlaceNameAr");
      const descAr = pick(d, "descriptionAr", "DescriptionAr"), descEn = pick(d, "description", "Description") || "";
      const city = pick(d, "city", "City"), lat = pick(d, "latitude", "Latitude"), lng = pick(d, "longitude", "Longitude");
      let image = safeUrl(pick(d, "imageUrl", "ImageUrl", "image", "Image")), credit = pick(d, "imageCredit", "ImageCredit");
      if (!image && window.Dalni) { const e = (await window.Dalni.imageIndex()).get(window.Dalni.normName(en)); if (e) { image = safeUrl(e.image); credit = e.credit; } }
      return {
        id: pick(d, "id", "Id"), name: ar || en, nameEn: en, city, type: pick(d, "placeType", "PlaceType"),
        description: descAr || descEn, descIsAr: !!descAr || isAr(descEn),
        budget: pick(d, "budgetLevel", "BudgetLevel"),
        trips: [].concat(pick(d, "tripType", "TripType") || []), ages: [].concat(pick(d, "ageGroup", "AgeGroup") || []),
        cost: pick(d, "estimatedCostIls", "EstimatedCostIls") ?? null,
        lat, lng, precise: lat != null && lng != null && isPrecise(+lat, +lng, city), image, credit,
      };
    }

    // ----- Render -----
    function render(p) {
      const cityName = CITY_LABELS[p.city] || p.city || "", img = safeUrl(p.image);
      const items = loadItems(), me = items.find((x) => String(x.id) === String(p.id));
      const others = items.filter((x) => String(x.id) !== String(p.id) && x.linked !== false).slice(0, 4);
      const q = p.precise ? `${p.lat},${p.lng}` : encodeURIComponent(`${p.name} ${cityName} فلسطين`);
      const dirUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
      const glass = "grid size-10 place-items-center rounded-full bg-card/90 text-foreground shadow backdrop-blur transition-colors hover:bg-card";
      const costText = p.cost == null ? "" : p.cost === 0 ? "دخول مجاني (تقديري)" : `${esc(p.cost)} ₪ للشخص (تقديري)`;

      const facts = [
        factRow("map-pin", "المدينة", esc(cityName)),
        factRow("wallet", "مستوى الميزانية", esc(BUDGET_LABELS[p.budget] || p.budget || "—")),
        costText ? factRow("banknote", "التكلفة", costText) : "",
        factRow("compass", "أنواع الرحلات", chips(p.trips, TRIP_TYPE_LABELS) || "—"),
        factRow("users", "الفئة العمرية", chips(p.ages, AGE_GROUP_LABELS) || "—"),
      ].join("");

      const calc = p.cost == null ? "" : p.cost === 0
        ? `<section class="rounded-2xl border bg-card p-5"><h2 class="font-display text-sm font-bold">التكلفة</h2><p class="mt-3 font-display text-2xl font-extrabold text-olive">دخول مجاني</p><p class="mt-1 text-xs text-muted-foreground">حسب التقدير، وممكن تختلف الأسعار حسب الموسم.</p></section>`
        : `<section class="rounded-2xl border bg-card p-5">
            <h2 class="font-display text-sm font-bold">احسبي تكلفة الزيارة</h2>
            <div class="mt-4 flex items-center justify-between">
              <span class="text-sm text-muted-foreground">عدد الأشخاص</span>
              <div class="flex items-center gap-2">
                <button id="n-dec" type="button" aria-label="أقل" class="grid size-8 place-items-center rounded-full border border-border text-lg leading-none hover:border-primary/40 disabled:opacity-40">−</button>
                <output id="n-val" class="w-7 text-center font-display text-lg font-bold" aria-live="polite">2</output>
                <button id="n-inc" type="button" aria-label="أكثر" class="grid size-8 place-items-center rounded-full border border-border text-lg leading-none hover:border-primary/40 disabled:opacity-40">+</button>
              </div>
            </div>
            <p id="calc-total" class="mt-4 font-display text-3xl font-extrabold"></p>
            <p id="calc-note" class="mt-1 text-xs text-muted-foreground"></p>
            <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-muted"><div id="calc-bar" class="h-full rounded-full transition-all" style="width:0"></div></div>
            <p id="calc-fit"></p>
            <p class="mt-3 text-[11px] text-muted-foreground">تكلفة تقديرية للدخول فقط.</p>
          </section>`;

      $("place-root").innerHTML = `
        <section class="fade-in relative overflow-hidden rounded-3xl bg-hero text-hero-foreground">
          <div class="relative aspect-[4/3] w-full sm:aspect-[21/9]" style="background:linear-gradient(135deg,var(--olive),var(--terracotta))">
            <div class="tatreez-pattern absolute inset-0 opacity-[0.12]"></div>
            <div class="absolute inset-0 grid place-items-center text-white/60"><i data-lucide="${TYPE_ICON[p.type] || "map-pin"}" class="size-16"></i></div>
            ${img ? `<img src="${esc(img)}" alt="${esc(p.name)}" class="absolute inset-0 h-full w-full object-cover" onerror="this.remove()" />` : ""}
            <div class="absolute inset-0 bg-gradient-to-t from-hero/85 via-hero/20 to-transparent"></div>
            <div class="absolute end-4 top-4 flex gap-2 sm:end-6 sm:top-6">
              <button id="fav-btn" type="button" aria-pressed="false" class="fav-btn inline-flex h-10 items-center gap-1.5 rounded-full bg-card/90 px-4 text-sm font-semibold text-foreground shadow backdrop-blur transition-colors hover:bg-card"><i data-lucide="heart" class="size-[18px]"></i><span>حفظ</span></button>
              <button id="share-btn" type="button" aria-label="مشاركة" title="مشاركة" class="${glass}"><i data-lucide="share-2" class="size-[18px]"></i></button>
              <a href="${dirUrl}" target="_blank" rel="noopener" aria-label="افتح في خرائط جوجل" title="افتح في خرائط جوجل" class="${glass}"><i data-lucide="navigation" class="size-[18px]"></i></a>
            </div>
            <div class="absolute inset-x-0 bottom-0 p-5 sm:p-8">
              <span class="inline-block rounded-full bg-sand px-3 py-1 text-xs font-bold text-foreground">${esc(PLACE_TYPE_LABELS[p.type] || p.type || "")}</span>
              <h1 class="mt-3 max-w-3xl text-2xl font-extrabold leading-snug sm:text-4xl">${esc(p.name)}</h1>
              <p class="mt-2 flex items-center gap-1.5 text-sm text-hero-foreground/80"><i data-lucide="map-pin" class="size-4"></i>${esc(cityName)}</p>
            </div>
          </div>
          ${p.credit && img ? `<p class="bg-hero px-5 py-1.5 text-[11px] text-hero-foreground/60">${esc(p.credit)}</p>` : ""}
        </section>

        <div class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1fr)_21rem]">
          <div class="space-y-8">
            ${p.description ? `<p ${p.descIsAr ? "" : 'dir="auto"'} class="text-lg leading-loose text-muted-foreground">${esc(p.description)}</p>` : ""}
            <dl class="divide-y divide-border rounded-2xl border bg-card">${facts}</dl>
            ${fitHTML(p)}
            <section>
              <div class="flex items-end justify-between gap-3">
                <h2 class="text-xl font-bold">الموقع</h2>
                <a href="${dirUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-sm font-bold text-primary hover:text-terracotta"><i data-lucide="navigation" class="size-4"></i>افتح في خرائط جوجل</a>
              </div>
              ${p.precise ? "" : `<p class="mt-1 text-xs text-muted-foreground">الموقع الدقيق مش متوفر، والدائرة بتبيّن منطقة ${esc(cityName)} تقريباً.</p>`}
              <div id="place-map" class="mt-3 h-72 w-full overflow-hidden rounded-2xl border"></div>
            </section>
          </div>

          <aside class="space-y-4 lg:sticky lg:top-24 lg:self-start">
            ${me ? `<section class="flex items-center gap-4 rounded-2xl border bg-card p-5">${ring(me.pct)}
              <div><p class="font-display text-sm font-bold">ملاءمة لتفضيلاتك</p><p class="mt-1 text-xs text-muted-foreground">الترتيب ${esc(me.rank)} من ${items.length} أماكن</p></div></section>` : ""}
            ${calc}
          </aside>
        </div>

        ${others.length ? `<section class="mt-12">
          <h2 class="text-xl font-bold">من نتائجك أيضاً</h2>
          <ul class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">${others.map((o) => `
            <li><a href="place.html?id=${encodeURIComponent(o.id)}" class="flex h-full items-center gap-3 rounded-2xl border bg-card p-3 transition-colors hover:border-primary/40">
              <span class="grid size-9 shrink-0 place-items-center rounded-full bg-muted font-display text-xs font-bold">#${esc(o.rank)}</span>
              <span class="min-w-0 flex-1"><span class="block truncate text-sm font-bold">${esc(o.name)}</span><span class="block text-xs text-muted-foreground">${esc(CITY_LABELS[o.city] || o.city)}</span></span>
              <span class="font-display text-sm font-bold text-terracotta">${esc(o.pct)}٪</span></a></li>`).join("")}</ul>
        </section>` : ""}`;

      lucide.createIcons();
      wireActions(p); wireCalc(p); wireMap(p);
    }

    function message(text) {
      $("place-root").innerHTML = `<div class="rounded-3xl border bg-card p-8"><p class="text-lg font-bold">${esc(text)}</p>
        <div class="mt-4 flex flex-wrap gap-2"><a href="preferences.html" class="rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-primary-foreground">بدء بحث جديد</a>
        ${sessionStorage.getItem("aiTravelResults") ? `<a href="results.html" class="rounded-xl border border-border px-5 py-2.5 text-sm font-semibold hover:border-primary/40">الرجوع للتوصيات</a>` : ""}</div></div>`;
    }

    (async function init() {
      renderCrumbs("");
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { message("اختاري مكان من صفحة التوصيات لتشوفي تفاصيله."); return; }
      try {
        const place = await loadPlace(id);
        if (!place) { message("ما لقينا هالمكان."); return; }
        document.title = `${place.name} — دلني`; renderCrumbs(place.name); render(place);
      } catch (e) { console.error(e); message("تعذر جلب تفاصيل المكان. تأكدي إن الـ API شغال وجربي مرة ثانية."); }
    })();
  </script>
</body>

</html>
